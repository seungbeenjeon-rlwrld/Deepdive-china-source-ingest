# Behaviour lives here; credentials live in .env (never commit .env).
provider: claude-cli

output:
  root_dir: ./research
  save_markdown: true
  save_json: true
  save_raw_response: true
  save_raw_sources: true

research:
  stage0_prompt: ./prompts/prompt0_name_resolution.md
  stage1_prompt: ./prompts/prompt1_entity_discovery.md
  stage2_prompt: ./prompts/prompt2_source_collection.md
  # Soft guard. If prompt 2 + the full stage 1 result exceeds this, we warn
  # loudly but still send everything — stage 1 output is never truncated.
  max_context_chars: 120000

  # Retrieval WE run, injected into the stage prompts. This replaces a
  # provider's own search tool, which is typically a paid add-on (Zhipu's is
  # $0.01/use and is refused at zero balance). Two advantages beyond cost:
  # it uses the Baidu index (measured 79% domains a Western index misses), and
  # the exact evidence handed to the model is written to disk, so a downstream
  # reader can check what the model could and could not have seen.
  # 사용자가 입력한 하나의 글로벌 이름을 중국어 검색명으로 확장함.
  # 영어 이름만으로 중국 인덱스를 검색하면 해당 회사를 놓치고 동명이인 회사가
  # 나옴 — "AgiBot" 검색 시 수술로봇 회사 AGIBOT敏捷机器人 이 함께 반환됨.
  name_resolution:
    enabled: true
    max_names: 8

  retrieval_injection:
    enabled: true
    # 검색을 담당할 provider. search_sweep 과 독립적임 — sweep 을 끄더라도
    # 프롬프트 주입 검색은 계속 동작해야 하기 때문. null 이면 search_sweep.provider 를 씀.
    provider: serpapi
    seed_queries:
      - "{company}"
      - "{company} 工商 法定代表人 注册资本"
      - "{company} 子公司 分公司 合资"
      - "{company} 产品 型号 发布"
      - "{company} 融资 股东 估值"
      - "{company} 客户 合作 订单"
    max_seed_queries: 8
    results_per_query: 20
    max_results: 60
    chars_per_result: 220

# Claude Code CLI as the LLM. No API key needed — uses the CLI's own
# authentication. Requires `claude` on PATH:
#   curl -fsSL https://claude.ai/install.sh | bash
#
# Trade-off: this shares your interactive Claude Code subscription allowance,
# so a large batch can slow your own session. For scheduled bulk runs prefer a
# metered provider.
claude_cli:
  binary: claude
  model: null                              # null = the CLI's default model
  timeout_seconds: 900
  disallowed_tools: "WebSearch,WebFetch"   # retrieval is injected; keep runs reproducible
  extra_args: []

# Polite HTTP fetching for article bodies. Identifies itself, rate-limits and
# honours robots.txt. Never aimed at hosts that gate automated access (WeChat
# serves a verification page; that is reported, not circumvented).
fetch:
  user_agent: "china-research/0.1 (research source-collection tool)"
  delay_seconds: 1.5
  timeout_seconds: 30
  max_bytes: 3000000
  respect_robots: true

# For sources whose original is gated (WeChat), find a readable repost. The
# repost is saved as its OWN source linked to the original; the original's
# URL_ONLY label is never overwritten.
repost_resolution:
  enabled: true
  max_sources: 10

# Primary-source registries — prompt 2 §10 priorities 1 and 5, and the thing a
# chat window genuinely cannot do: enumerate the complete set rather than
# surfacing two or three hits. Both endpoints are open; no Chinese account.
registries:
  filings_search_key: null      # listed entity for 巨潮资讯网, e.g. 上纬新材
  patent_assignee: null         # legal entity, e.g. 上海智元新创技术有限公司
  max_filings: 60
  max_patents: 60
  # Read the primary filings, do not just link them. Measured: WebFetch returns
  # "raw PDF binary stream" for a cninfo PDF at 6MB and at 114KB alike, so a
  # bare link leaves the downstream reader with nothing. Extracted text is
  # split by chapter (第N节) and capped per file so a reader opens one part.
  extract_filing_text: true
  max_pdf_mb: 40
  max_section_chars: 40000

# Second evidence channel: structured search over the queries stage 1
# recommended. SearchPro on Tencent, /web_search on Z.ai. Both honour
# site_filters, so mp.weixin.qq.com works either way.
search_sweep:
  enabled: true
  # Baidu, via SerpApi. Its job is grounding, not exclusivity: injected results
  # are what let stage 0 resolve an English name into the Chinese registry name
  # the filings and patent channels then search on.
  #
  # It is not a source of facts nobody else has. Measured against Claude web
  # search on Unitree across five angles — product specs, ownership structure,
  # government procurement, patents, supply chain — every one came back covered
  # there, usually in more detail. The often-quoted "79% of domains absent from
  # a Claude-search corpus" is real but is domain diversity, not information
  # diversity: those domains were largely the same product launches reposted.
  #
  # So the sweep is deliberately narrow. Each query costs one SerpApi call per
  # site filter, and the free tier is 250/month.
  provider: serpapi
  max_queries: 6
  results_per_query: 20
  mode: 2                # 0 = web results, 1 = VR cards, 2 = mixed
  freshness: null        # e.g. y2 = last two years, m3 = last three months
  site_filters:
    - null                 # unrestricted
    - mp.weixin.qq.com     # WeChat Official Account articles
  industries: []         # e.g. [gov, acad, news, finance]
